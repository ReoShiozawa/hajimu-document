name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML構文検査
        run: |
          python -m pip install --disable-pip-version-check html5validator
          html5validator --root . --also-check-css
